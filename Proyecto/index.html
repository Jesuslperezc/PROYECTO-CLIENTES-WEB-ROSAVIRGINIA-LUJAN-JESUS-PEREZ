<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Power Casino</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <section id="main-menu" class="main-menu">     
        <h1>Black Power Casino</h1>
        <div class="menu-robot-container">
            <img src="" alt="Robot Dealer" class="robot-menu">
        </div>
        <nav>
            <ul>
                <li><button class="boton-menu" onclick="selectMode('solitario')">Juega solitario</button></li>
                <li><button class="boton-menu" onclick="selectMode('multijugador')">Juega multijugador</button></li>
                <li><button class="boton-menu" onclick="selectMode('sin-reloj')">Juega sin reloj</button></li>
            </ul>
        </nav>
    </section>

    <section id="selection-menu" class="selection-menu oculto">
        <h2>Selecciona la dificultad</h2>
        <nav>
            <ul>
                <li><button class="boton-seleccion" id="Facil" onclick="selectDifficulty('easy')">Modo Facil 4x4</button></li>
                <li><button class="boton-seleccion" id="Medio" onclick="selectDifficulty('medium')">Modo Medio 6x6</button></li>
                <li><button class="boton-seleccion" id="Dificil" onclick="selectDifficulty('hard')">Modo Dificil 8x8</button></li>
            </ul>
        </nav>
    </section>

    <section id="theme-menu" class="theme-menu oculto">
        <h2>Elige a tu Croupier</h2>
        
        <div class="theme-grid">
            <button class="card-button" onclick="selectTheme('clasico')">
                <img src="" alt="Clásico" class="card-img">
                <div class="card-footer"><span class="card-text">Clasico-Bot</span></div>
            </button>

            <button class="card-button" onclick="selectTheme('playa')">
                <img src="" alt="Playa" class="card-img">
                <div class="card-footer"><span class="card-text">Playa-Bot</span></div>
            </button>

            <button class="card-button" onclick="selectTheme('mundial')">
                <img src="" alt="Mundial" class="card-img">
                <div class="card-footer"><span class="card-text">Mundial-Bot</span></div>
            </button>

            <button class="card-button" onclick="selectTheme('safari')">
                <img src="" alt="Safari" class="card-img">
                <div class="card-footer"><span class="card-text">Safari-Bot</span></div>
            </button>
        </div>
    </section>

    <main id="game-container" class="game-container oculto">
        
        <section id="dealer-zone" class="dealer-box">
            <img id="dealer-img" src="" alt="Dealer Reacción">
   
        </section>

        <div id="memory-board" class="game-board"></div>
        
        <div class="game-hud">
            <h2>Información del juego</h2>
            <p>Turno del jugador: <span id="player-turn">Jugador 1</span></p>
            <p>Tiempo restante: <span id="timer">60</span> segundos</p>
            <button id="restart-button">Reiniciar Juego</button>
        </div>
    </main>

    <script src="js/menu.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/modes.js"></script>
    <script src="js/themes.js"></script>
</body>
</html>
