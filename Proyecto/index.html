<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="main-menu">     
        <h1>Black Power Casino</h1>
        <img src= alt="Robot" class="robot-menu">
        <nav>
            <ul>
                
                <li><button class="boton-menu" >Juega solitario</button> </button> </li>
                <li><button class="boton-menu"> Juega multijugador</button></li>
                <li><button class="boton-menu"> Juega sin reloj</button></li>

            </ul>
        </nav>
    </section>


    <section class="selection-menu">
        <nav>
            <ul>
                
                <li><button class="boton-seleccion " id="Facil">Modo Facil 4x4</button></li>
                <li><button class="boton-seleccion"id="Medio"> Modo Medio 6x6</button></li>
                <li><button class="boton-seleccion"id="Dificil"> Modo Dificil 8x8</button></li>

            </ul>
        </nav>
    </section>

    <section class="theme-menu">
        <nav>
            <ul>
                
                <li><button class="boton-theme" id="Clasico">Clasico-Bot</button></li>
                <li><button class="boton-theme" id="Playa"> Playa-Bot</button></li>
                <li><button class="boton-theme"id="Mundial"> Mundial-Bot</button></li>
                <li><button class="boton-theme"id="Safari"> Safari-Bot</button></li>

            </ul>
        </nav>
    </section>

    <main class="game-container">
        <div class="game-board">

        </div>
        <div class="game-hud">
            <h2>Información del juego</h2>
            <p>Turno del jugador: <span id="player-turn">Jugador 1</span></p>
            <p>Tiempo restante: <span id="timer">60</span> segundos</p>
            <button id="restart-button">Reiniciar Juego</button>
        </div>
    </main>

    <script src="js/menu.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/modes.js"></script>
    <script src="js/themes.js"></script>

</body>
</html>
