<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Power Casino</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <section id="main-menu" class="main-menu">   
        <div class="menu-franja">
            <h1>Black Power Casino</h1>
        </div>
        <div class="menu-robot-container">
            <img src="assets/robot_mesa.png" alt="Robot Dealer" class="robot-menu">
        </div>
        <nav>
            <ul>
                <li><button class="boton-menu" data-mode="solitario"> <img src="assets/carta_solitario.png" alt="Juega solitario"></button></li>
                <li><button class="boton-menu" data-mode="multijugador"> <img src="assets/carta_multijugador.png" alt="Juega multijugador"></button></li>
                <li><button class="boton-menu" data-mode="sin-reloj"> <img src="assets/carta_sin_reloj.png" alt="Juega sin reloj"></button></li>
            </ul>

            <ul>
                <li><button class="boton-menu-tema" data-mode="tema">  <img src="assets/carta_tema.png" alt="Seleccionar Tema"> </button></li>
            </ul>
        </nav>
    </section>

    <section id="selection-menu" class="selection-menu oculto">
        <h2>Selecciona la dificultad</h2>
        <div id="inputs-nombres" class="oculto">
            <div class=" flex-input">
                <input type="text" id="input-j1" placeholder="Nombre Apostador 1" maxlength="10">
                <input type="text" id="input-j2" placeholder="Nombre Apostador 2" maxlength="10">
            </div>
        </div>
        <nav>
            <ul>
                <li><button class="boton-seleccion" data-difficulty="easy" id="Facil">Modo Facil 4x4</button></li>
                <li><button class="boton-seleccion" data-difficulty="medium" id="Medio">Modo Medio 6x6</button></li>
                <li><button class="boton-seleccion" data-difficulty="hard" id="Dificil">Modo Dificil 8x8</button></li>
                <li><button class="boton-back" data-function="back" >Volver al menú principal</button></li>
            </ul>
        </nav>
    </section>

    <section id="theme-menu" class="theme-menu oculto">
        <h2>Elige a tu Croupier</h2>
        
        <div class="theme-grid">
            <button class="card-button" data-theme="clasico">
                <img src="" alt="Clásico" class="card-img">
                <div class="card-footer"><span class="card-text">Clasico-Bot</span></div>
            </button>

            <button class="card-button" data-theme="playa">
                <img src="" alt="Playa" class="card-img">
                <div class="card-footer"><span class="card-text">Playa-Bot</span></div>
            </button>

            <button class="card-button" data-theme="mundial">
                <img src="" alt="Mundial" class="card-img">
                <div class="card-footer"><span class="card-text">Mundial-Bot</span></div>
            </button>

            <button class="card-button" data-theme="safari">
                <img src="" alt="Safari" class="card-img">
                <div class="card-footer"><span class="card-text">Safari-Bot</span></div>
            </button>
        </div>

        <button class="boton-back" data-function="back" >Volver al menú principal</button>
    </section>
    <main id="game-container" class="game-container oculto">
        
        <section id="dealer-zone" class="dealer-box">
            <img id="dealer-img" src="" alt="Dealer Reacción">
        </section>

        <div id="memory-board" class="game-board">
            </div>
        
        <div class="game-hud">
            <h2>Información del juego</h2>
            <p>Turno del jugador: <span id="player-turn">Jugador 1</span></p>
            <p>Tiempo restante: <span id="timer">00:00</span> segundos</p>
            <button id="restart-button">Reiniciar Juego</button>
        </div>
    </main>

    <script src="js/themes.js"></script>
    <script src="js/app.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/dif.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
